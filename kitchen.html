/* The ending of The Gluten Conflict: same cabinet screen as the game, buttons appear under it once the Polaroid is out */
:root{--bg:#191614;--ink:#f3e9dc;--muted:#b5a797;--chip:#352e28;--line:#463d35;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.cab{width:min(100%,calc((100dvh - 110px)*.6667),480px);aspect-ratio:2/3;border-radius:6px;overflow:hidden;outline:2px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button,.btn{font:inherit;font-weight:700;font-size:15px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none}
.btn.shop{background:#e23200;border-color:#e23200;color:#fff}
button:focus-visible,.btn:focus-visible{outline:2px solid #e69000;outline-offset:2px}
[hidden]{display:none!important}
.cab{position:relative}
#endbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 10px max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,14,10,0),rgba(20,14,10,.82) 30%)}
#endbar .row{flex-wrap:nowrap;gap:5px;width:100%;max-width:440px;padding:0 4px;box-sizing:border-box}
#endbar .row button,#endbar .row .btn{display:flex;align-items:center;justify-content:center;height:42px;flex:1 1 auto;min-width:0;box-sizing:border-box;padding:0 clamp(12px,3.4vw,18px) 3px;border:0;border-radius:0;background:none;white-space:nowrap;border-image:url(art/ui/btn-brown.webp) 50% 31% fill / 50% 24px round;-webkit-tap-highlight-color:transparent}
#endbar .row button:active,#endbar .row .btn:active{border-image-source:url(art/ui/btn-brown-down.webp)}
#endbar .row .btn.shop{border-image-source:url(art/ui/btn-red.webp)}
#endbar .row .btn.shop:active{border-image-source:url(art/ui/btn-red-down.webp)}
#endbar .row :active>img{transform:translateY(2px)}
#endbar .row img{flex:0 1 auto;min-width:0;max-width:100%}
#endbar .row .bic{height:18px;width:auto;flex:none;margin-right:5px}
#endbar .row .fl{display:flex;align-items:center;min-width:0}
#endbar .row .btn.shop{flex-grow:1.4}
#endbar .credits a{color:inherit;text-decoration:underline;text-underline-offset:2px}
#endbar .credits{color:#e9dccb;margin:0;font-size:clamp(10px,2.9vw,12px);line-height:1.5}
.credits{font-size:12px;line-height:1.6;color:var(--muted);text-align:center;margin-top:2px}
/* Phones: the game fills the screen edge to edge, nothing zooms, selects or pops up on fast taps, and the tuning bench is hidden */
@media (pointer:coarse){
  html,body{margin:0!important;width:100%;overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{background:#0e0b09}
  .wrap{gap:0!important;padding:0!important;width:100%;max-width:none!important}
  .cab,.stack{width:100%!important;max-width:none!important;border-radius:0!important;outline:none!important}
  .pad,#hint{display:none!important}
}
.haspad .cab{width:min(100%,calc((100dvh - 110px - 160px)*.6667),480px)}
.haspad #hint{display:none}
/* On-screen controller under the screen on touch devices (or with ?pad=1), so fingers never cover the play area */
.pad{display:none}
.haspad .pad{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:150px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#2a231e,#211b17);border:2px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.joy{position:relative;width:116px;height:116px;border-radius:50%;background:url(art/pad/base.webp) center/100% 100% no-repeat;touch-action:none;flex:none}
.joy .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;background:url(art/pad/knob.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));pointer-events:none}
.pbtns{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px 12px;align-items:center;justify-items:center}
.pbtn{border:0;border-radius:50%;background:center/100% 100% no-repeat;font:900 15px Gooper,Georgia,serif;letter-spacing:.03em;color:#fff;-webkit-text-stroke:4px #231f20;paint-order:stroke fill;touch-action:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));padding:0;cursor:pointer}
.pbtn:active,.pbtn.on{transform:translateY(2px);filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}

const FELT_IM={};function feltIm(col,ch){const g=FELT[col][ch];if(!g)return null;const k=g[0];if(!FELT_IM[k])FELT_IM[k]=Object.assign(new Image(),{src:'art/font2/'+k+'.webp'});return FELT_IM[k];}
const FELT_OL={k:'#231f20',r:'#e23200'};
function feltAdv(col,ch,h,c=g){if(ch===' ')return h*.34;const gl=FELT[col][ch];if(gl)return gl[3]*h*.9;c.font=`900 ${h/.7}px Gooper,Georgia,serif`;return c.measureText(ch).width+h*.12;}
function feltWidth(txt,h,col='k',c=g){txt=String(txt).toUpperCase();let w=0;for(const ch of txt)w+=feltAdv(col,ch,h,c);return w;}

function feltText(txt,x,y,h,col='k',align='center',c=g){txt=String(txt).toUpperCase();const tw=feltWidth(txt,h,col,c);let cx=align==='center'?x-tw/2:align==='right'?x-tw:x;const top=y-h/2;
  for(const ch of txt){const adv=feltAdv(col,ch,h,c);if(ch!==' '){const gl=FELT[col][ch],im=feltIm(col,ch);
      if(gl&&loadedF(im)){const w=gl[3]*h;c.drawImage(im,cx+(adv-w)/2,top+gl[1]*h,w,gl[2]*h);}
      else{c.save();c.font=`900 ${h/.7}px Gooper,Georgia,serif`;c.textAlign='center';c.textBaseline='alphabetic';c.lineJoin='round';c.lineWidth=h*.24;c.strokeStyle=FELT_OL[col];
        c.strokeText(ch,cx+adv/2,top+h);c.fillStyle='#fff';c.fillText(ch,cx+adv/2,top+h);c.restore();}}
    cx+=adv;}}

<script>
/* Phones: size the screen in plain pixels from the real window, fitted to the 2:3 game and centered, so no browser can
   end up showing it at the canvas's own (much larger) size */
(function(){if(!matchMedia('(pointer:coarse)').matches)return;
  function fit(){const cab=document.querySelector('.cab'),cv=cab&&cab.querySelector('canvas');if(!cv)return;
    const vw=document.documentElement.clientWidth||innerWidth,vh=innerHeight,w=Math.floor(Math.min(vw,vh*2/3)),h=Math.floor(w*1.5);
    for(const el of [cab,cv]){el.style.width=w+'px';el.style.height=h+'px';}cab.style.aspectRatio='auto';cab.style.margin='0 auto';
    const st=document.querySelector('.stack');if(st){st.style.width=w+'px';st.style.margin='0 auto';}}
  addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
  if(document.readyState!=='loading')fit();else addEventListener('DOMContentLoaded',fit);addEventListener('load',fit);})();
</script>
