<!doctype html>

<style>
/* The ending of The Gluten Conflict: same cabinet screen as the game, buttons appear under it once the Polaroid is out */
:root{--bg:#191614;--ink:#f3e9dc;--muted:#b5a797;--chip:#352e28;--line:#463d35;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.cab{width:min(100%,calc((100dvh - 110px)*.6667),480px);aspect-ratio:2/3;border-radius:6px;overflow:hidden;outline:2px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}

button,.btn{font:inherit;font-weight:700;font-size:15px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none}
.btn.shop{background:#e23200;border-color:#e23200;color:#fff}
button:focus-visible,.btn:focus-visible{outline:2px solid #e69000;outline-offset:2px}
[hidden]{display:none!important}
p{margin:0;color:var(--muted);font-size:13px;max-width:480px;text-align:center}
</style>
<div class="wrap">
  <div class="cab"><canvas id="c" width="960" height="1440" tabindex="0" aria-label="Ramen cooking ending: shoot the kettle, burner, noodle box and seasoning to cook ramen"></canvas></div>
  <div class="row" id="polrow" hidden><button id="save">Save photo</button><button id="share">Share</button><a class="btn shop" id="shop" href="https://www.samabila.com/" target="_blank" rel="noopener">Shop Samabila</a><a class="btn" href="./">Play again</a></div>
  <p id="hint">Arrows or WASD to fly, hold Z to fire. On a phone, drag to fly. Steady fire is neat, mashing is messy.</p>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');g.scale(2,2);
const W=480,H=720,TABLE=360;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const F='Fredoka,system-ui,sans-serif';
/* ---------- layout ---------- */
const BURNER={x0:146,x1:334,cx:240,top:500,base:575};
const POT={x:240,base:506,rx:62,ry:17,hgt:76,DEPTH:38};
const KNOB={x:332,y:561,r:14};
const potRim=()=>POT.base-POT.hgt;
/* the coffee table's top surface in world space (from the table's place in the room photo): where spilled water can pool */
const TOP={y0:478.0,y1:613.5,bl:161,br:364,bf:583,
  /* the glass top is a trapezoid in perspective: narrower at the back edge, wider at the front (measured off the kitchen photo) */
  inside(x,y){const t=clamp((y-478.0)/(613.5-478.0),0,1);return x>lerp(151.1,111.5,t)&&x<lerp(330.6,357.9,t);}};
/* view zoom: the whole kitchen is drawn a bit smaller around the bottom-center of the screen, easing back to 1 for the hero shot */
const VIEWK=1;
function viewK(){return lerp(VIEWK,1,typeof S==='undefined'?0:heroE());}
/* the camera is panned so the scene sits higher, leaving breathing room at the bottom; the pan eases out for the hero shot */
const PAN=72,TILT=-206,TILT_T=170;
/* the scene opens looking out the window at San Ramyeon's main street, then tilts down to the table */
function tiltE(){if(typeof S==='undefined')return 1;const t=Math.min(1,S.t/TILT_T);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function panY(){if(typeof S==='undefined')return PAN;return PAN*(1-heroE())+TILT*(1-tiltE());}
function viewL(){return 240-240/viewK();}function viewR(){return 240+240/viewK();}
/* play bounds ignore the opening tilt, so the ship waits below and rises into view as the camera settles */
function panBase(){return typeof S==='undefined'?PAN:PAN*(1-heroE());}
function viewTop(){return 720+(panBase()-720)/viewK();}function viewBot(){return 720+(panBase()-56)/viewK();}
/* the pitcher hovers left of the pot and tips on its bottom-right corner (the pivot), spout over the pot */
const PIV={x:144,y:322};
/* a gold aluminum kettle, in its own coordinates: pivot at the bottom-right of the body, spout on the right */
/* the felt kettle, in its own coordinates: pivot at the bottom-right of the body, spout on the right (measured off the art) */
const KET_BODY=[[-96,-2],[-10,-2],[2,-20],[4,-50],[-6,-76],[-20,-86],[-88,-86],[-102,-76],[-108,-50],[-104,-20]];
const KET_SPOUT=[[-2,-46],[14,-50],[28,-60],[34,-66],[40,-62],[38,-56],[26,-46],[12,-30],[-1,-16]];
const SPOUT=[42,-80],SPOUT_DIR=.69,LID=[[-20,-86],[-88,-86]];
const PIT_SAMPLES=(()=>{const a=[];for(let y=-84;y<-2;y+=3)for(let x=-104;x<2;x+=3)a.push([x,y]);return a;})();
const rot=(th,x,y)=>[x*Math.cos(th)-y*Math.sin(th),x*Math.sin(th)+y*Math.cos(th)];
function levelY(th,Wf){const ys=PIT_SAMPLES.map(([x,y])=>rot(th,x,y)[1]).sort((a,b)=>a-b);return ys[clamp(Math.floor((1-Wf)*ys.length),0,ys.length-1)];}
const spoutY=th=>rot(th,SPOUT[0],SPOUT[1])[1];
/* angle at which the water just reaches the spout, for each fill level */
const NEED=[];for(let i=0;i<=50;i++){const Wf=i/50;let lo=0,hi=2.4;for(let k=0;k<14;k++){const m=(lo+hi)/2;levelY(m,Wf)<spoutY(m)?hi=m:lo=m;}NEED.push(hi);}
const need=Wf=>NEED[clamp(Math.round(Wf*50),0,50)];
/* fire timing: holding fires every AUTO frames; each fresh press fires at once, so mashing is faster */
const AUTO=11,MINGAP=3,K=.007,DAMP=.1;
/* the four Samabila seasonings, named as on samabila.com */
const FLAVORS=[{n:'Korean',bw:'korean',cap:'My Korean Ramen',k:'pk-red',c:'#e0452c',b:[236,178,128]},{n:'Chicken',bw:'chicken',cap:'My Chicken Ramen',k:'pk-yellow',c:'#e9a93a',b:[236,208,140]},
  {n:'Chicken Lite',bw:'lite',cap:'My Chicken Lite Ramen',k:'pk-green',c:'#a8c63f',b:[238,224,176]},{n:'Pho',bw:'pho',cap:'My Viet Beef Ph\u1edf',k:'pk-purple',c:'#7b3f9a',b:[218,180,132]}];
for(const f of FLAVORS)f.pw=`rgb(${f.b.map(v=>Math.round(v*.86)).join(',')})`;
const N=22;
let S;
function reset(){S={t:0,step:0,stepT:0,
  ship:{x:240,y:650},bullets:[],since:99,puffs:[],
  pot:{V:0,h:new Float32Array(N),v:new Float32Array(N),temp:0,mix:0,broth:null},
  pit:{x:-130,th:0,om:0,W:.85,flash:0,gone:false},
  flame:0,lit:false,
  bag:null,brick:null,packs:null,pack:null,powder:[],
  drops:[],puddles:[],bubbles:[],steam:[],spilled:0,splashMax:0,cook:0,drop:[],added:[],vHit:new Set(),kfx:{hk:0},pad:null,land:0,hero:0,jars:null,tops:[],flying:[],cam:null,topHits:0,flash:0,polaroid:null,polT:0,snapping:false};
  const pr=document.getElementById('polrow');if(pr)pr.hidden=true;}
reset();
/* ---------- input ---------- */
const keys={};let fireDown=false,pressQueued=false,touch=null;
const isFire=k=>k==='z'||k==='Z'||k===' '||k==='x'||k==='X';
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();keys[e.key.toLowerCase()]=true;if(isFire(e.key)){if(!e.repeat)pressQueued=true;fireDown=true;}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(isFire(e.key))fireDown=false;});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);touch={px:p.x,py:p.y,sx:S.ship.x,sy:S.ship.y};pressQueued=true;fireDown=true;});
cv.addEventListener('pointermove',e=>{if(!touch)return;const p=pt(e);S.ship.x=touch.sx+(p.x-touch.px)*1.2/viewK();S.ship.y=touch.sy+(p.y-touch.py)*1.2/viewK();});
const up=()=>{touch=null;fireDown=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- helpers ---------- */
function puff(x,y,c='#fff6d8'){for(let k=0;k<6;k++)S.puffs.push({x,y,vx:rnd(-2,2),vy:rnd(-2.5,.5),life:0,c});}
function inRot(px,py,cx,cy,a,hw,hh){const [lx,ly]=rot(-a,px-cx,py-cy);return Math.abs(lx)<hw&&Math.abs(ly)<hh;}
/* the water is a level surface inside the pot: an ellipse that sits deeper and a little narrower the emptier the pot is */
function surfE(V){if(V==null)V=S.pot.V;const d=1-clamp(V,0,1),sc=1-d*.28;return {x:POT.x,cy:potRim()+PIN.dy+d*24,rx:PIN.rx*sc*.96,ry:PIN.ry*sc*.96};}
function surfY(){return surfE().cy;}
function bowlImg(){const f=S.pack&&S.pack.f,im=f&&ART['bowl-'+f.bw];return ok(im)?im:null;}
function finished(){return S.step>=10&&!!bowlImg();}
function potIndex(x){return clamp(Math.round((x-POT.x+POT.rx)/(POT.rx*2)*(N-1)),0,N-1);}
function setStep(n){S.step=n;S.stepT=0;}
/* ---------- targets: each step has one live thing; a bullet only hits that */
/* ---------- weapons carried over from the run ----------
   The kitchen keeps its own fire rhythm (that is what the pour and flame physics are tuned to): each volley counts as one hit,
   however many projectiles it has. The volley just looks and sounds like the weapon and level you finished the boss with. */
const SFX=(()=>{
  let ac=null,out,verb,muted=false;const last={},vol=.8;
  const pulses={},noise={};
  function init(){
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;lp.Q.value=.3;
    out=ac.createGain();out.gain.value=muted?0:vol;out.connect(lp);lp.connect(comp);
    /* Brick-wall limiter last in the chain, so loud moments like the bomb can't clip */
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-1.5;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.1;comp.connect(lim);lim.connect(ac.destination);
    /* Small room: a short decaying noise impulse */
    verb=ac.createConvolver();const len=ac.sampleRate*.55,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    verb.buffer=ir;const wet=ac.createGain();wet.gain.value=.16;verb.connect(wet);wet.connect(out);
    for(const d of [.125,.25,.5]){const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulses[d]=ac.createPeriodicWave(re,im);}
    /* NES noise: 15-bit LFSR, long mode taps bit 1, short "metallic" mode taps bit 6 */
    for(const short of [false,true]){const len=ac.sampleRate,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let r=1;
      for(let i=0;i<len;i++){const fb=(r&1)^((r>>(short?6:1))&1);r=(r>>1)|(fb<<14);d[i]=(r&1)?.8:-.8;}noise[short]=b;}
  }
  function bus(pan,rev){const gn=ac.createGain(),pn=ac.createStereoPanner?ac.createStereoPanner():null;
    if(pn){pn.pan.value=Math.max(-.8,Math.min(.8,pan||0));gn.connect(pn);pn.connect(out);if(rev)pn.connect(verb);}else{gn.connect(out);if(rev)gn.connect(verb);}return gn;}
  function env(gn,t,v,a,dur){gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+a);gn.gain.exponentialRampToValueAtTime(.0005,t+dur);}
  /* A pulse, triangle or sine voice with a pitch sweep */
  function tone(o){const t=ac.currentTime+(o.at||0),osc=ac.createOscillator();
    if(o.duty)osc.setPeriodicWave(pulses[o.duty]);else osc.type=o.type||'triangle';
    const j=o.jit?1+(Math.random()*2-1)*o.jit:1;osc.frequency.setValueAtTime(o.f*j,t);if(o.f1)osc.frequency.exponentialRampToValueAtTime(o.f1*j,t+(o.sw||o.d));
    const gn=bus(o.pan,o.rev);env(gn.gain?gn:gn,t,o.v,o.a||.003,o.d);osc.connect(gn);osc.start(t);osc.stop(t+o.d+.05);}
  /* LFSR noise; playback rate sets the pitch, an optional filter shapes it */
  function hiss(o){const t=ac.currentTime+(o.at||0),src=ac.createBufferSource();src.buffer=noise[!!o.metal];src.loop=true;
    src.playbackRate.setValueAtTime(o.r,t);if(o.r1)src.playbackRate.exponentialRampToValueAtTime(o.r1,t+o.d);
    let node=src;if(o.lp||o.bp||o.hp){const fl=ac.createBiquadFilter();fl.type=o.lp?'lowpass':o.bp?'bandpass':'highpass';fl.frequency.setValueAtTime(o.lp||o.bp||o.hp,t);if(o.f1)fl.frequency.exponentialRampToValueAtTime(o.f1,t+o.d);fl.Q.value=o.q||.7;src.connect(fl);node=fl;}
    const gn=bus(o.pan,o.rev);env(gn,t,o.v,o.a||.002,o.d);node.connect(gn);src.start(t,Math.random()*.5);src.stop(t+o.d+.05);}
  const notes=(fs,step,o)=>fs.forEach((f,i)=>tone(Object.assign({f,at:i*step},o)));
  /* Recorded samples: Billy's ukulele notes (B D E F B, the B blues scale) for the chili shot, and two impact knocks */
  const SAMP={notes:[1,2,3,4,5].map(n=>({muted:null,open:null,n})),block:[null,null],shot:null};let sampLoading=false,lastNote=-1,lastBlock=-1;
  function loadSamples(){if(sampLoading||!ac)return;sampLoading=true;
    const get=(u,cb)=>fetch(u).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>ac.decodeAudioData(b,res,rej))).then(cb).catch(()=>{});
    SAMP.notes.forEach(o=>{get(`sfx/${o.n}-muted.wav`,b=>o.muted=b);get(`sfx/${o.n}-open.wav`,b=>o.open=b);});
    get('sfx/8-block.wav',b=>SAMP.shot=b);FX_NAMES.forEach(n=>get(`sfx/${n}.wav`,b=>FX[n]=b));get('sfx/6-block.wav',b=>SAMP.block[0]=b);get('sfx/7-block.wav',b=>SAMP.block[1]=b);}
  const FX={},FX_NAMES=['bomb','boss_damage_1','boss_damage_2','boss_die','enemy_die_2','enemy_die_3','laser_shot','laser_shot_2','laser_shot_3','player_die','laser_beam','enemy_shot'],fxLast={};
  function fx(names,pan,v,rate=1){const ready=names.filter(n=>FX[n]);if(!ready.length)return false;const key=names.join();
    let i;do{i=Math.floor(Math.random()*ready.length);}while(ready.length>1&&ready[i]===fxLast[key]);fxLast[key]=ready[i];
    sample(FX[ready[i]],pan,v,rate*(1+(Math.random()*2-1)*.03));return true;}
  function sample(buf,pan,v,rate=1){const src=ac.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;const gn=bus(pan,true);gn.gain.value=v;src.connect(gn);src.start();}
  const LIB={
    /* Chili shot: a random ukulele note each volley (never the same note twice in a row), randomly open or muted */
    /* Chili shot: knock 8, pitched down about three semitones, with a touch of variation */
    shot:p=>{const b=SAMP.shot;
      if(!b){tone({duty:.125,f:1500,f1:620,d:.06,v:.07,pan:p,jit:.06});return;}
      sample(b,p,.3,.84*(1+(Math.random()*2-1)*.025));},
    /* Chili impact: one of the two recorded knocks, with a touch of pitch variation */
    /* Chili impact: alternates knocks 6 and 7 */
    block:p=>{const ready=SAMP.block.filter(Boolean);if(!ready.length){LIB.hit(p);return;}
      let i;do{i=Math.floor(Math.random()*ready.length);}while(ready.length>1&&i===lastBlock);lastBlock=i;sample(ready[i],p,.3,1+(Math.random()*2-1)*.04);},
    rang:p=>{tone({duty:.25,f:260,f1:720,d:.14,v:.06,pan:p,jit:.05});hiss({r:.35,bp:1800,f1:900,d:.12,v:.05,pan:p});},
    catch:p=>{tone({duty:.25,f:1760,d:.05,v:.06,pan:p});},
    bolt:p=>{if(!fx(['laser_shot','laser_shot_2','laser_shot_3'],p,.5))tone({duty:.25,f:2300,f1:880,d:.07,v:.08,pan:p,jit:.04});},
    full:p=>{notes([1760,2637],.06,{duty:.5,d:.12,v:.08,pan:p,rev:1});},
    whip:p=>{hiss({r:1,hp:2500,d:.06,v:.12,pan:p});tone({duty:.125,f:900,f1:240,d:.09,v:.06,pan:p});},
    hit:p=>{hiss({r:.18,lp:1400,d:.05,v:.16,pan:p});tone({type:'triangle',f:190,f1:85,d:.06,v:.22,pan:p,jit:.12});},
    grunt:p=>{if(!fx(['boss_damage_1','boss_damage_2'],p,.55))tone({duty:.5,f:150,f1:85,d:.14,v:.1,pan:p,jit:.08});},
    /* Small kill: a crunchy crack, a dark rumbling burst, and a low thump for weight, so it reads as a little explosion */
    pop:p=>{if(!fx(['enemy_die_2','enemy_die_3'],p,.32)){hiss({metal:1,r:.5,hp:1500,d:.04,v:.12,pan:p});hiss({r:.12,lp:2200,f1:180,d:.45,v:.3,pan:p,rev:1,jit:.1});tone({type:'triangle',f:140,f1:40,d:.25,v:.3,pan:p,jit:.1});tone({duty:.5,f:300,f1:45,d:.18,v:.05,pan:p,jit:.08});}},
    /* Big kills: the same enemy explosions pitched down for weight */
    boom:p=>{if(!fx(['enemy_die_2','enemy_die_3'],p,.5,.74)){hiss({r:.09,lp:1800,f1:120,d:.6,v:.42,pan:p,rev:1});tone({type:'triangle',f:120,f1:34,d:.5,v:.4,pan:p});}},
    /* Enemy fire: one sound per burst, a bit under the player's own sounds */
    eshot:p=>{fx(['enemy_shot'],p,.32);},
    segboom:p=>{fx(['boss_damage_1','boss_damage_2'],p,.6);},
    bossdie:p=>{if(!fx(['boss_die'],p,.85))LIB.boom(p);},
    snap:p=>{hiss({r:1,hp:3500,d:.03,v:.12,pan:p,jit:.1});tone({duty:.125,f:2600,f1:1300,d:.035,v:.04,pan:p,jit:.1});},
    smash:p=>{hiss({metal:1,r:.25,lp:3500,f1:500,d:.35,v:.24,pan:p,rev:1});tone({type:'triangle',f:160,f1:60,d:.2,v:.3,pan:p});},
    puff:p=>{hiss({r:.12,lp:900,f1:300,d:.12,v:.14,pan:p});},
    bag:p=>{notes([523,659,784,1047,1319],.05,{duty:.25,d:.1,v:.07,pan:p,rev:1});},
    medal:p=>{notes([1568,2093],.045,{duty:.5,d:.08,v:.06,pan:p});},
    item:p=>{notes([392,523,659],.06,{duty:.25,d:.12,v:.07,pan:p,rev:1});},
    life:p=>{notes([523,659,784,1047,784,1047,1319],.07,{duty:.5,d:.14,v:.07,pan:p,rev:1});tone({type:'triangle',f:131,d:.5,v:.18,at:.07});},
    bomb:p=>{if(!fx(['bomb'],p,1.5)){hiss({r:.05,lp:600,f1:3000,d:.9,v:.35,a:.15,rev:1});tone({type:'triangle',f:55,f1:110,d:.9,v:.4,a:.1});}},
    option:p=>{notes([1047,1319,1568,2093,2637,3136],.05,{type:'triangle',d:.3,v:.12,pan:p,rev:1});},
    warning:()=>{for(let i=0;i<4;i++){tone({duty:.5,f:520,d:.22,v:.08,at:i*.5,rev:1});tone({duty:.5,f:390,d:.22,v:.08,at:i*.5+.25,rev:1});}},
    death:p=>{if(!fx(['player_die'],p,.8)){tone({duty:.5,f:880,f1:90,d:.7,v:.1,pan:p,sw:.7});hiss({r:.08,lp:2200,f1:100,d:.9,v:.4,pan:p,rev:1});}},
    whoosh:()=>{hiss({r:.6,bp:400,f1:3500,d:.8,v:.18,q:1.2,a:.25,rev:1});},
    calm:()=>{notes([392,494,587,784,988],.16,{type:'triangle',d:.4,v:.16,rev:1});},
  };
  /* Repeats of the same sound closer than this many ms are dropped, so rapid fire doesn't pile up */
  const GAP={eshot:110,bossdie:400,bomb:200,death:300,block:45,hit:45,shot:55,puff:90,snap:30,grunt:220,medal:40,pop:70,catch:60,bolt:40};
  let chargeOsc=null,chargeGn=null,beamOsc=null,beamGn=null;
  function play(name,x){if(!ac||muted||!LIB[name])return;const now=performance.now();if(GAP[name]&&now-(last[name]||0)<GAP[name])return;last[name]=now;
    LIB[name](x===undefined?0:(x/W-.5)*1.4);}
  /* Continuous voices: the laser charge whine and the beam buzz follow game state every frame */
  let prevC=0;
